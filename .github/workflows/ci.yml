name: CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────
  # STAGE 1: QUALITY (lint, types, format)
  # ─────────────────────────────────────────
  quality:
    name: 🔍 Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Format check
        run: npx prettier --check "src/**/*.{ts,tsx,css}" --write

    #   - name: Security audit
    #     run: npm audit --audit-level=high

  # ─────────────────────────────────────────
  # STAGE 2A: UNIT + INTEGRATION TESTS
  # ─────────────────────────────────────────
  unit-tests:
    name: 🧪 Unit & Integration
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm

      - run: npm ci

      - name: Run unit + integration tests
        run: npm run test:ci

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ─────────────────────────────────────────
  # STAGE 3: BUILD
  # ─────────────────────────────────────────
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm

      - run: npm ci

      - name: Build production
        run: npm run build
        env:
          NODE_ENV: production

    #   - name: Analyze bundle size
    #     run: npx vite-bundle-visualizer --json > bundle-stats.json

      # Current limit: 500kb
    #   - name: Bundle size check
    #     run: |
    #       SIZE=$(du -sk dist/ | cut -f1)
    #       echo "Bundle size: ${SIZE}KB"
    #       if [ $SIZE -gt 500 ]; then
    #         echo "❌ Bundle too large: ${SIZE}KB (max 500KB)"
    #         exit 1
    #       fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: dist/
          retention-days: 3
